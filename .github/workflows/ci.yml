name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Testar métricas do benchmark
        shell: bash
        run: PYTHONPATH=benchmarks/transcricao python -m unittest discover -s benchmarks/transcricao/tests
      - run: cargo test --workspace
      - run: bun run typecheck
      - run: bun run build
      - name: Install browser dependencies (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Install browser (Windows)
        if: runner.os == 'Windows'
        run: bunx playwright install chromium
      - run: bun run test:contrast
      - run: bun run test:ui
