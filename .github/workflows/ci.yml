name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      # Harness #59: executável separado com libass e x264, só mídia sintética.
      - name: Install FFmpeg with libass (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Verify libass for export parity
        shell: bash
        run: ffmpeg -hide_banner -h filter=ass
      - run: bun install --frozen-lockfile
      - name: Testar métricas do benchmark
        shell: bash
        run: PYTHONPATH=benchmarks/transcricao python -m unittest discover -s benchmarks/transcricao/tests
      - run: cargo test --workspace
      - run: bun run typecheck
      - run: bun run build
      - name: Install browser dependencies (Linux)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium
      - name: Install browser (Windows)
        if: runner.os == 'Windows'
        run: bunx playwright install chromium
      - run: bun run test:contrast
      - run: bun run test:ui
  e2e:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if apt-cache show webkitgtk-webdriver >/dev/null 2>&1; then
            DRIVER_PKG=webkitgtk-webdriver
          else
            DRIVER_PKG=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf "$DRIVER_PKG" xvfb ffmpeg
      - name: Ensure FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - run: cargo install tauri-driver --locked
      - run: bun install --frozen-lockfile
      - run: bun run e2e:setup
      - name: Configure WebView2 remote debugging policy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name 'clipes.exe' -Value '--remote-debugging-port=0' -PropertyType String -Force | Out-Null
      - name: Run Tauri E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a env WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 bun run test:e2e
      - name: Run Tauri E2E (Windows)
        if: runner.os == 'Windows'
        run: bun run test:e2e
  worker:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.8'
      - name: Testar o worker contra as mensagens de exemplo
        run: uv run --frozen --extra cpu --project worker pytest worker/tests
      - name: Verificar licenças do ambiente Python fixado
        run: uv run --frozen --extra cpu --project worker python worker/check_licenses.py
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses bans advisories sources
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: design-system
      - name: Check JS production licenses
        shell: bash
        run: |
          node --test scripts/license-policy.test.mjs
          bunx license-checker-rseidelsohn@4.4.2 --production --unknown --start . --excludePackages 'clipes@0.1.0' --json | node scripts/check-licenses.mjs
          bunx license-checker-rseidelsohn@4.4.2 --production --unknown --start design-system --excludePackages '@clipes/design-system@0.1.0' --json | node scripts/check-licenses.mjs
