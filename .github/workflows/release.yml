name: Instaladores e release

on:
  pull_request:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            path: target/release/bundle/nsis/*.exe
            artifact: windows-nsis
          - os: ubuntu-latest
            bundles: appimage,deb
            path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Gerar hashes e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd installers
          shopt -s nullglob
          windows=( *.exe )
          appimages=( *.AppImage )
          debs=( *.deb )
          test "${#windows[@]}" -eq 1 && test "${#appimages[@]}" -eq 1 && test "${#debs[@]}" -eq 1
          sha256sum "${windows[@]}" "${appimages[@]}" "${debs[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${windows[@]}" "${appimages[@]}" "${debs[@]}" SHA256SUMS.txt --generate-notes
