name: Instaladores e release

on:
  pull_request:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            path: target/release/bundle/nsis/*.exe
            artifact: windows-nsis
          - os: ubuntu-latest
            bundles: appimage,deb
            path: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Compilar instaladores
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            bun run tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            bun run tauri build --bundles ${{ matrix.bundles }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      - name: Guardar artefatos assinados do updater
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.artifact }}
          path: |
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb.sig
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Gerar hashes e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd installers
          shopt -s nullglob
          windows=( *.exe )
          appimages=( *.AppImage )
          appimage_signatures=( *.AppImage.sig )
          windows_signatures=( *.exe.sig )
          deb_signatures=( *.deb.sig )
          debs=( *.deb )
          test "${#windows[@]}" -eq 1 && test "${#appimages[@]}" -eq 1 && test "${#debs[@]}" -eq 1
          test "${#windows_signatures[@]}" -eq 1 && test "${#deb_signatures[@]}" -eq 1 && test "${#appimage_signatures[@]}" -eq 1
          sha256sum "${windows[@]}" "${appimages[@]}" "${debs[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${windows[@]}" "${appimages[@]}" "${debs[@]}" "${windows_signatures[@]}" "${deb_signatures[@]}" "${appimage_signatures[@]}" SHA256SUMS.txt --generate-notes
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
          RELEASE_NOTES="$(cat release-notes.md)" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GH_REPO"]
          version = tag.removeprefix("v")
          windows = next(Path(".").glob("*.exe"))
          windows_signature = Path(f"{windows}.sig").read_text().strip()
          deb = next(Path(".").glob("*.deb"))
          deb_signature = Path(f"{deb}.sig").read_text().strip()
          appimage = next(Path(".").glob("*.AppImage"))
          appimage_signature = Path(f"{appimage}.sig").read_text().strip()
          base = f"https://github.com/{repo}/releases/download/{tag}"
          payload = {
              "version": version,
              "notes": os.environ["RELEASE_NOTES"].strip() or f"Atualização do Clipes para a versão {version}.",
              "platforms": {
                  "windows-x86_64-nsis": {
                      "url": f"{base}/{windows}",
                      "signature": windows_signature,
                  },
                  "linux-x86_64-deb": {
                      "url": f"{base}/{deb}",
                      "signature": deb_signature,
                  },
                  "linux-x86_64-appimage": {
                      "url": f"{base}/{appimage}",
                      "signature": appimage_signature,
                  },
              },
          }
          Path("latest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          PY
          gh release upload "$RELEASE_TAG" latest.json --clobber
