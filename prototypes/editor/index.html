<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Clipes — protótipo</title><link rel="stylesheet" href="style.css"><body><header><strong>CLIPES</strong> <span>Protótipo descartável · editor</span></header><main><section class="screen"><div id="preview"><video id="video" preload="auto" playsinline src="/media/fonte.mp4"></video><div id="caption"></div></div><div class="controls"><button id="play">▶ / ❚❚</button><span id="clock">00:00:00</span><label>Fonte <select id="source"><option value="fonte.mp4">Original</option><option value="proxy.mp4">Proxy</option></select></label><span>Arraste a imagem para reenquadrar</span></div></section><section class="edit"><h1>Corte</h1><p>Use a timeline para navegar pela Fonte; ajuste as bordas sem alterar o vídeo.</p><label>Início <input id="start" type="number" step="0.033" min="0" value="0"> s</label><label>Fim <input id="end" type="number" step="0.033" min="0" value="60"> s</label><label>Zoom <input id="zoom" type="range" min="1" max="100" value="1"></label><p id="state"></p><button id="bench">Medir 30 buscas</button><p id="benchResult"></p></section></main><section class="timeline"><div class="title">TIMELINE <span id="bounds"></span></div><div id="rail"><div id="selection"><i id="left"></i><i id="right"></i></div><div id="cursor"></div></div><small>Arraste o cursor ou as alças. O zoom centraliza no ponto atual.</small></section><script src="app.js"></script><script src="medicoes.js"></script></body></html>
