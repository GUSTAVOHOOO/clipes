[package]
name = "clipes-editor-prototipo"
version = "0.2.0"
edition = "2021"
description = "Protótipo descartável do editor de Cortes do Clipes"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 1
